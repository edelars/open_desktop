[package]
name = "od-uefi-security"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[features]
verify = ["dep:rsa", "dep:x509-cert", "sha2/oid"]

[dependencies]
der = { version = "=0.8.3", default-features = false, features = ["oid"] }
rsa = { version = "=0.10.0", default-features = false, features = ["pkcs1v15", "encoding"], optional = true }
sha2 = { version = "=0.11.1", default-features = false }
x509-cert = { version = "=0.3.0", default-features = false, optional = true }
