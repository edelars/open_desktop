[package]
name = "od-host"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
od-isa = { path = "../od-isa" }
od-jit = { path = "../od-jit" }
od-machine = { path = "../od-machine" }
od-storage = { path = "../od-storage" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc = { version = "=0.2.190", default-features = false }

[dev-dependencies]
od-storage = { path = "../od-storage", features = ["test-support"] }
od-testkit = { path = "../od-testkit" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[[test]]
name = "stage3_dword_store_corpus"
path = "../../tests/cpu/stage3_dword_store_corpus.rs"

[[test]]
name = "stage4_memory_fault"
path = "../../tests/system/stage4_memory_fault.rs"

[[test]]
name = "stage4_exception_delivery"
path = "../../tests/system/stage4_exception_delivery.rs"

[[test]]
name = "stage9_storage_kill"
path = "../../tests/system/stage9_storage_kill.rs"

[[test]]
name = "stage9_storage_concurrency"
path = "../../tests/system/stage9_storage_concurrency.rs"

[lints]
workspace = true
