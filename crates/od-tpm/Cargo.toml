[package]
name = "od-tpm"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Versions and features come from ADR-0009 (decision 2) and docs/policies/DEPENDENCIES.md.
# Phase A (S7-21) needs only SHA-256 and memory wiping; the other crates of the ADR
# (sha1, hmac, aes, cfb-mode, rsa, p256, ecdsa) belong to S7-23 and are not added here.
[dependencies]
sha2 = { version = "=0.11.1", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }

[lints]
workspace = true
