[package]
name = "od-tpm"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

# Versions and features come from ADR-0009 (decision 2) and docs/policies/DEPENDENCIES.md.
# Phase A (S7-21) needs SHA-256 and memory wiping; slice A of phase B (S7-23) adds `hmac` (HMAC
# for sessions, KDFa and the DRBG); slice B adds `rsa` (RSA-2048 PKCS#1 v1.5 keys and signatures)
# and `p256` (ECC P-256 ECDSA), and `aes` + `cfb-mode` (AES-128-CFB protection of `outPrivate`).
# Slice C1 adds RSA encryption (`TPM2_RSA_Encrypt/Decrypt`: OAEP and RSAES come from `rsa` without a
# feature, the NULL scheme (raw RSA) needs `hazmat`) and ECDH (`TPM2_ECDH_ZGen`: point multiplication of
# `p256` `arithmetic`, already enabled by `ecdsa`; feature `ecdh` of the ADR is not needed, see
# docs/policies/DEPENDENCIES.md).
# RSA-3072, RSASSA-PSS (`rsa::pss`) and OAEP with SHA-384/SHA-512 need no new feature of `rsa =0.10.0` (it has
# no `pss` feature; the module is always built), see docs/policies/DEPENDENCIES.md.
# Slice 6 adds `p384` (ECC P-384: ECDSA, ECDH, same features as `p256`), see docs/policies/DEPENDENCIES.md.
# Slice 7 adds `ml-dsa` (ML-DSA-65, FIPS 204; `alloc` keeps the expanded key off the stack, `zeroize` wipes it),
# see docs/policies/DEPENDENCIES.md.
# `der`, `spki`, `sha1` of the ADR are not needed by slices B and C1 and are not added.
[dependencies]
# Wipe the retained HMAC inner and outer SHA-256 state when a sequence ends.
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
rsa = { version = "=0.10.0", default-features = false, features = ["pkcs1v15", "hazmat"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
p384 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
aes = { version = "=0.9.4", default-features = false, features = ["zeroize"] }
cfb-mode = { version = "=0.9.1", default-features = false, features = ["zeroize"] }
ml-kem = { version = "=0.3.3", default-features = false, features = ["zeroize", "hazmat"] }
ml-dsa = { version = "=0.1.2", default-features = false, features = ["alloc", "zeroize"] }

[lints]
workspace = true
