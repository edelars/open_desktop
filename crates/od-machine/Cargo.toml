[package]
name = "od-machine"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
od-isa = { path = "../od-isa" }
od-jit = { path = "../od-jit" }
od-tpm = { path = "../od-tpm" }
od-uefi-security = { path = "../od-uefi-security", features = ["protected-nvram", "verify"] }
serde_json = "=1.0.151"
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
sha2 = { version = "=0.11.1", default-features = false }

[features]
# S6-38 diagnostic builds only. Time acquisitions of the two shared device locks.
lock-wait-metrics = []

experimental-translation-probe-cache = []
# S6-36, sensitivity part 1 (SMP.md 5.1): the host memory order of the parallel mode is weakened
# (ordinary RAM accesses Relaxed, host fences removed). FOR TESTS AND MEASUREMENTS ONLY; never in
# `default`, never in a product profile.
weak-host-ordering = []
# S6-36, sensitivity part 2 (SMP.md 5.1): guest `LOCK` is made non-atomic (a load and a store).
# FOR TESTS AND MEASUREMENTS ONLY; never in `default`, never in a product profile. A different
# feature from the one above.
nonatomic-lock-test = []

[lints]
workspace = true
