[workspace]
resolver = "3"
members = [
    "crates/od-isa",
    "crates/od-jit",
    "crates/od-machine",
    "crates/od-storage",
    "crates/od-host",
    "crates/od-testkit",
    "tools/runner",
    "tools/x86-runner",
    "tools/bench",
    "tools/image-tool",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
