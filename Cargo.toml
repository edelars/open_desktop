[workspace]
resolver = "3"
members = [
    "crates/od-isa",
    "crates/od-jit",
    "crates/od-machine",
    "crates/od-storage",
    "crates/od-tpm",
    "crates/od-host",
    "crates/od-testkit",
    "tools/runner",
    "tools/x86-runner",
    "tools/bench",
    "tools/image-tool",
    "tools/power-loss",
]
# Guest-target firmware: own Cargo project with its own target (firmware/uefi/README.md).
exclude = ["firmware/uefi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
