name = "acpi"
path = "acpi/main.rs"
test = false
bench = false
doc = false

[[bin]]
name = "gop"
path = "gop/main.rs"
test = false
bench = false
doc = false

[[bin]]
name = "blk"
path = "blk/main.rs"
test = false
bench = false
doc = false

[[bin]]
name = "hello"
path = "hello/main.rs"
test = false
bench = false
doc = false

[[bin]]
name = "ebs"
path = "ebs/main.rs"
test = false
bench = false
doc = false

[[bin]]
name = "echo"
path = "echo/main.rs"
test = false
bench = false
doc = false

[[bin]]
name = "vars"
path = "vars/main.rs"
test = false
bench = false
doc = false

[[bin]]
name = "rt"
path = "rt/main.rs"
test = false
bench = false
doc = false

[profile.dev]
