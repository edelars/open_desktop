[package]
name = "od-image-tool"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "od_image_tool"
path = "src/lib.rs"

[[bin]]
name = "od-image-tool"
path = "src/main.rs"

[dependencies]
od-host = { path = "../../crates/od-host" }
# The CoW image modules are a prototype exposed under this feature until a
# format is accepted (S9-40); the tool is their first non-test user.
od-storage = { path = "../../crates/od-storage", features = ["test-support"] }
# Payload manifests and SHA-256 of inputs and outputs (S8-22, S8-27); same pins as od-tpm and od-host.
serde_json = "=1.0.151"
sha2 = { version = "=0.11.1", default-features = false }

[lints]
workspace = true
