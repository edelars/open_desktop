[package]
name = "od-runner"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "od-runner"
path = "src/main.rs"

[dependencies]
od-isa = { path = "../../crates/od-isa" }
od-jit = { path = "../../crates/od-jit" }
od-machine = { path = "../../crates/od-machine" }
od-testkit = { path = "../../crates/od-testkit" }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
od-host = { path = "../../crates/od-host" }

[lints]
workspace = true

[features]
lock-wait-metrics = ["od-machine/lock-wait-metrics"]
