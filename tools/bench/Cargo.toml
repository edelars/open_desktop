[package]
name = "od-bench"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
od-isa = { path = "../../crates/od-isa" }
od-jit = { path = "../../crates/od-jit", features = ["phase-observation"] }
od-machine = { path = "../../crates/od-machine", features = ["experimental-translation-probe-cache"] }
od-testkit = { path = "../../crates/od-testkit" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
od-host = { path = "../../crates/od-host" }

[lints]
workspace = true
