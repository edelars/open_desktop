<!-- @dsCard group="Status" height=120 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Status preview</title></head>
<body>
<div id="root" class="od-stack od-grid"></div>
<script>
  var O = window.OpenDesktop, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'od-row', style: { padding: 0 } }, h(O.Status, { status: 'accepted' }), h(O.Status, { status: 'in-progress' }), h(O.Status, { status: 'partial' }), h(O.Status, { status: 'early' }), h(O.Status, { status: 'planned' })),
    h('div', { className: 'od-row', style: { padding: 0 } }, h(O.Status, { status: 'pass' }), h(O.Status, { status: 'fail' }))));
</script>
</body>
</html>
