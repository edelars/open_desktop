<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Desktop</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--grid); color: var(--ink); font-family: var(--font-display); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .ink { fill: var(--ink); }
  .trace { fill: var(--trace); }
  .bar { rx: var(--radius-1); }
  .plus { stroke: var(--line-strong); stroke-width: 1; fill: none; }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 100px; line-height: .95; font-weight: 600; letter-spacing: -.01em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 4px; font-family: var(--font-mono); font-size: 13px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      the mark at cover scale: ink top bar cut 40/136/72/120 (x86 variable-length bytes), trace middle bar 452 wide, bleeding 4px off the right edge, ink bottom bar cut into four equal 92-wide words (ARM64); each 64 tall (space-12 + space-4); about 27% of 960×288
  arrangement a strip of unequal bands stacked with space-6 gutters, starting space-6 from the top, left edge at space-8 inside the box
  pattern     plus grid, "precise, technical, mono": the protocol grid of grid-pitch thinned to one plus every space-12 (10 × 6 = 60 units) in line-strong, visible in the cuts between segments
  scales      space-6, space-8, space-12, grid-pitch; radius-1 on every bar
-->
  <g class="plus">
    <path d="M24 20v8M20 24h8M72 20v8M68 24h8M120 20v8M116 24h8M168 20v8M164 24h8M216 20v8M212 24h8M264 20v8M260 24h8M312 20v8M308 24h8M360 20v8M356 24h8M408 20v8M404 24h8M456 20v8M452 24h8"/>

</svg>
</div>
<div class="words">
