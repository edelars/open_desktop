<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Logo preview</title></head>
<body>
<div id="root" class="od-row od-grid"></div>
<script>
  var O = window.OpenDesktop, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(O.Logo, { size: 48 }),
    h(O.Logo, { size: 32, lockup: 'mark' }),
    h(O.Logo, { size: 16, lockup: 'mark' }),
    h(O.Logo, { size: 24, tone: 'mono' })));
</script>
</body>
</html>
